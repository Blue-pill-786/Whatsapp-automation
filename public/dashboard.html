<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Automation Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card h2 {
      margin: 0;
      font-size: 28px;
    }

    .card p {
      margin: 5px 0 0;
      color: #777;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    th {
      background: #f1f1f1;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: white;
    }

    .badge-new {
      background: #28a745;
    }

  </style>
</head>
<body>

  <h1>📊 WhatsApp Leads Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h2 id="totalLeads">0</h2>
      <p>Total Leads</p>
    </div>

    <div class="card">
      <h2 id="todayLeads">0</h2>
      <p>Today's Leads</p>
    </div>

    <div class="card">
      <h2 id="pricingLeads">0</h2>
      <p>Pricing Leads</p>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Lead ID</th>
        <th>Phone</th>
        <th>Intent</th>
        <th>Message</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="leadsTable"></tbody>
  </table>

  <script>
    const clientId = "988302764362380";

    async function loadStats() {
      const res = await fetch(`/admin/stats/${clientId}`);
      const data = await res.json();

      document.getElementById("totalLeads").innerText = data.totalLeads;
      document.getElementById("todayLeads").innerText = data.todayLeads;
      document.getElementById("pricingLeads").innerText = data.pricingLeads;
    }

    async function loadLeads() {
      const res = await fetch(`/admin/leads/${clientId}`);
      const leads = await res.json();

      const table = document.getElementById("leadsTable");
      table.innerHTML = "";

      leads.forEach(row => {
        table.innerHTML += `
          <tr>
            <td>${row[0]}</td>
            <td>${row[4]}</td>
            <td>${row[5]}</td>
            <td>${row[6]}</td>
            <td><span class="badge badge-new">${row[7]}</span></td>
          </tr>
        `;
      });
    }

    loadStats();
    loadLeads();
  </script>

</body>
</html>
